<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090b18">
  <title>Claw Machine Controller</title>
  <style>
    :root { --blue:#176cff; --cyan:#42d9ff; --red:#ff3150; --gold:#ffc83d; --panel:rgba(18,24,48,.88); --line:rgba(255,255,255,.13); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; touch-action:none; }
    body { color:#fff; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(circle at 20% 0,#172d67 0,transparent 38%),radial-gradient(circle at 100% 100%,#53152c 0,transparent 38%),#070914; padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left)); }
    main { width:min(100%,560px); height:100%; margin:auto; display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:clamp(10px,2vh,18px); }
    header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border:1px solid var(--line); border-radius:18px; background:var(--panel); box-shadow:0 14px 35px #0007; }
    h1 { margin:0; font-size:clamp(1rem,4.5vw,1.35rem); letter-spacing:.08em; text-transform:uppercase; }
    .connection { display:flex; align-items:center; gap:7px; color:#aeb8cf; font-size:.74rem; font-weight:700; }
    .dot { width:11px; height:11px; border-radius:50%; background:var(--red); box-shadow:0 0 12px var(--red); }
    .connected .dot { background:#34df83; box-shadow:0 0 12px #34df83; }
    .connected .label { color:#b8ffd5; }
    .controls { min-height:0; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(110px,.85fr); gap:clamp(12px,3vw,20px); }
    .dpad { min-height:0; display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); gap:8px; aspect-ratio:1; align-self:center; }
    button { border:1px solid rgba(255,255,255,.18); color:#fff; font:inherit; font-weight:900; cursor:pointer; touch-action:none; background:linear-gradient(145deg,#27345c,#12182f); box-shadow:0 8px 18px #0008,inset 0 1px #ffffff38,inset 0 -4px #0005; transition:transform 65ms,filter 65ms; }
    button.active,button:active { transform:translateY(4px) scale(.97); filter:brightness(.8); box-shadow:0 3px 8px #0008,inset 0 2px 5px #0007; }
    .move { border-radius:20px; font-size:clamp(1.55rem,8vw,2.5rem); }
    #up { grid-area:1/2; } #left { grid-area:2/1; } #right { grid-area:2/3; } #down { grid-area:3/2; }
    .center { grid-area:2/2; display:grid; place-items:center; border-radius:50%; background:radial-gradient(circle,#26345b,#10162b); border:1px solid var(--line); color:#8290ad; font-size:.7rem; font-weight:800; text-align:center; }
    .actions { min-height:0; display:grid; grid-template-rows:1fr .48fr; gap:12px; }
    .action { border-radius:50%; align-self:center; aspect-ratio:1; font-size:clamp(1rem,5vw,1.65rem); letter-spacing:.05em; }
    #drop { background:radial-gradient(circle at 38% 30%,#ff7185,var(--red) 45%,#a70825 100%); border:5px solid #ff8da0; }
    #open { aspect-ratio:auto; min-height:64px; border-radius:22px; background:linear-gradient(145deg,#ffd968,#c88d00); color:#201500; font-size:clamp(.85rem,4vw,1.15rem); }
    footer { color:#8792aa; text-align:center; font-size:.72rem; letter-spacing:.06em; }
    @media (orientation:landscape) and (max-height:560px) { main{max-width:900px;grid-template: auto minmax(0,1fr)/1fr;} header{padding:7px 14px}.controls{grid-template-columns:1fr .55fr}.dpad{height:100%;width:auto;margin:auto}.actions{grid-template-columns:1fr 1fr;grid-template-rows:1fr}.action{height:100%;width:auto}#open{aspect-ratio:1;border-radius:50%}footer{display:none} }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Claw Controller</h1>
      <div id="connection" class="connection"><span class="dot"></span><span class="label">OFFLINE</span></div>
    </header>
    <section class="controls" aria-label="Claw controls">
      <div class="dpad">
        <button id="up" class="move" data-direction="up" aria-label="Move forward">▲</button>
        <button id="left" class="move" data-direction="left" aria-label="Move left">◀</button>
        <div class="center">MOVE<br>CLAW</div>
        <button id="right" class="move" data-direction="right" aria-label="Move right">▶</button>
        <button id="down" class="move" data-direction="down" aria-label="Move backward">▼</button>
      </div>
      <div class="actions">
        <button id="drop" class="action">DROP</button>
        <button id="open" class="action">OPEN</button>
      </div>
    </section>
    <footer>MACHINE: RED-BLUE-01</footer>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCMtbsKNIET9NjOyw2XHzA9PfyBn1yO1O4",
      authDomain: "fallingobjects-46163.firebaseapp.com",
      databaseURL: "https://fallingobjects-46163-default-rtdb.firebaseio.com",
      projectId: "fallingobjects-46163",
      storageBucket: "fallingobjects-46163.firebasestorage.app",
      messagingSenderId: "243170931177",
      appId: "1:243170931177:web:778f044433b5ee2956db78"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const control = db.ref("machines/red-blue-01/control");
    const connection = document.getElementById("connection");
    const heldPointers = new Map();

    function update(values) {
      return control.update(values).catch(error => console.error("Firebase write failed:", error));
    }

    function setDirection(direction, pressed) {
      document.getElementById(direction).classList.toggle("active", pressed);
      update({ [direction]: pressed });
    }

    document.querySelectorAll(".move").forEach(button => {
      button.addEventListener("pointerdown", event => {
        if (event.button !== 0) return;
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        heldPointers.set(event.pointerId, button.dataset.direction);
        setDirection(button.dataset.direction, true);
      });
      const release = event => {
        const direction = heldPointers.get(event.pointerId);
        if (!direction) return;
        heldPointers.delete(event.pointerId);
        setDirection(direction, false);
      };
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
    });

    function increment(command) {
      if (navigator.vibrate) navigator.vibrate(35);
      return control.child(command).transaction(value => (Number(value) || 0) + 1);
    }

    document.getElementById("drop").addEventListener("pointerdown", event => { event.preventDefault(); increment("dropCommand"); });
    document.getElementById("open").addEventListener("pointerdown", event => { event.preventDefault(); increment("openCommand"); });

    function releaseAll() {
      heldPointers.clear();
      document.querySelectorAll(".move").forEach(button => button.classList.remove("active"));
      update({ up:false, down:false, left:false, right:false });
    }

    db.ref(".info/connected").on("value", snapshot => {
      const online = snapshot.val() === true;
      connection.classList.toggle("connected", online);
      connection.querySelector(".label").textContent = online ? "ONLINE" : "OFFLINE";
      if (online) {
        control.onDisconnect().update({ up:false, down:false, left:false, right:false });
        releaseAll();
      }
    });

    window.addEventListener("blur", releaseAll);
    window.addEventListener("pagehide", releaseAll);
    document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });
    document.addEventListener("contextmenu", event => event.preventDefault());
    document.addEventListener("touchmove", event => event.preventDefault(), { passive:false });
  </script>
</body>
</html>
