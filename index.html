<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090b18">
  <title>Claw Machine Controller</title>
  <style>
    :root { --cyan:#50edf2; --cyan-deep:#00aeb8; --ice:#eefeff; --graphite:#28343b; --silver:#cad6d9; --panel:rgba(242,252,253,.92); --line:rgba(68,111,118,.22); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; touch-action:none; }
    body { color:var(--graphite); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(circle at 50% -15%,#29464d 0 8%,transparent 44%),radial-gradient(circle at 18% 82%,#0c3940 0,transparent 30%),linear-gradient(145deg,#080d0f,#172125 48%,#05090b); padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.25; background:repeating-linear-gradient(90deg,transparent 0 44px,#5ffaff0c 45px 46px),repeating-linear-gradient(0deg,transparent 0 44px,#5ffaff08 45px 46px); }
    main { width:min(100%,560px); height:100%; margin:auto; display:grid; grid-template-rows:auto auto minmax(0,1fr); gap:clamp(8px,1.5vh,14px); }
    header { position:relative; min-height:104px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:8px 54px 7px; overflow:hidden; border:2px solid #9cffff; border-radius:28px; background:linear-gradient(145deg,#fff 0 38%,#e3edef 72%,#c8d6d9); box-shadow:0 0 10px #50edf2,0 0 28px #19e8ef77,0 18px 38px #000b,inset 0 2px #fff,inset 0 -4px #93a9ad38; }
    header::after { content:""; position:absolute; inset:auto 7% 0; height:4px; border-radius:99px; background:#baffff; box-shadow:0 0 8px #fff,0 0 20px var(--cyan),0 0 38px var(--cyan); animation:neonPulse 2.4s ease-in-out infinite; }
    .logo { display:block; width:min(72vw,310px); height:76px; object-fit:contain; filter:drop-shadow(0 0 7px #50edf288) drop-shadow(0 5px 7px #26607932); }
    .connection { position:absolute; top:12px; right:13px; display:flex; align-items:center; gap:6px; color:#708187; font-size:.62rem; font-weight:900; }
    .dot { width:11px; height:11px; border-radius:50%; background:#89979b; box-shadow:0 0 10px #73888e; }
    .connected .dot { background:var(--cyan); box-shadow:0 0 14px var(--cyan-deep); }
    .connected .label { color:#008b94; }
    .session { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; }
    #start { min-height:54px; border:2px solid #caffff; border-radius:22px; background:linear-gradient(145deg,#efffff,#53f1f5 55%,#00a8b3); color:#12383b; font-size:clamp(1rem,5vw,1.35rem); letter-spacing:.08em; text-shadow:0 1px #fff8; box-shadow:0 0 10px #50edf2,0 0 24px #50edf288,inset 0 2px #fff; }
    #start:disabled { filter:grayscale(.7); opacity:.55; }
    .timer { min-width:82px; height:54px; display:grid; place-items:center; border:2px solid #60e9ee; border-radius:22px; background:#0b171acc; font-size:1.45rem; font-weight:900; font-variant-numeric:tabular-nums; color:#77c9cd; text-shadow:0 0 9px currentColor; box-shadow:0 0 16px #50edf255,inset 0 0 16px #50edf21f; }
    .timer.running { color:#007f87; box-shadow:inset 0 0 20px #50edf266,0 0 16px #50edf255; }
    .controls { position:relative; min-height:0; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(110px,.85fr); gap:clamp(12px,3vw,20px); padding:clamp(10px,2.5vw,16px); border:2px solid #8ffcff; border-radius:30px; background:linear-gradient(145deg,#fafffff2,#cbdadde8); box-shadow:0 0 9px #8ffcff,0 0 28px #50edf266,0 20px 38px #000a,inset 0 2px #fff,inset 0 -3px #849b9f33; }
    .controls::before { content:"ECC CONTROL DECK"; position:absolute; left:50%; top:5px; transform:translateX(-50%); white-space:nowrap; color:#698086; font-size:.46rem; font-weight:900; letter-spacing:.22em; }
    .controls.locked { opacity:.32; filter:grayscale(.7); pointer-events:none; }
    .dpad { min-height:0; display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); gap:8px; aspect-ratio:1; align-self:center; }
    button { border:2px solid #a8fcff; color:#195257; font:inherit; font-weight:900; cursor:pointer; touch-action:none; background:linear-gradient(145deg,#fff,#dce7e9 68%,#b9c9cc); box-shadow:0 0 8px #50edf288,0 9px 18px #0006,inset 0 2px #fff,inset 0 -4px #8fa4a844; transition:transform 65ms,filter 65ms,box-shadow 100ms; }
    button.active,button:active { transform:translateY(4px) scale(.97); filter:brightness(.8); box-shadow:0 3px 8px #0008,inset 0 2px 5px #0007; }
    .move { border-radius:24px; font-size:clamp(1.55rem,8vw,2.5rem); color:#00a5af; text-shadow:0 0 7px #fff,0 0 15px #50edf2; }
    #up { grid-area:1/2; } #left { grid-area:2/1; } #right { grid-area:2/3; } #down { grid-area:3/2; }
    .center { grid-area:2/2; display:grid; place-items:center; border-radius:50%; background:radial-gradient(circle,#faffff,#b9cbce); border:2px solid #7ceff3; color:#587076; font-size:.7rem; font-weight:900; text-align:center; box-shadow:0 0 18px #50edf288; }
    .actions { min-height:0; display:grid; grid-template-rows:1fr .48fr; gap:12px; }
    .action { border-radius:50%; align-self:center; aspect-ratio:1; display:grid; place-items:center; align-content:center; gap:5px; color:#164b50; }
    #drop { background:radial-gradient(circle at 38% 28%,#fff 0 10%,#adfbfd 35%,#42e1e7 62%,#00a1ac 100%); border:5px solid #dfffff; box-shadow:0 9px 20px #24797d66,0 0 22px #50edf2aa,inset 0 2px #fff; }
    #open { aspect-ratio:auto; min-height:72px; border-radius:24px; background:linear-gradient(145deg,#fff,#d5f8f9 62%,#91dfe3); }
    .action-label { font-size:clamp(.58rem,2.8vw,.76rem); letter-spacing:.14em; }
    .claw-icon { position:relative; width:54px; height:46px; display:block; }
    .claw-icon::before { content:""; position:absolute; left:24px; top:0; width:6px; height:18px; border-radius:8px; background:currentColor; box-shadow:0 0 8px #fff; }
    .claw-icon .hub { position:absolute; left:17px; top:14px; width:20px; height:14px; border:5px solid currentColor; border-radius:5px 5px 11px 11px; }
    .claw-icon .talon { position:absolute; top:25px; width:22px; height:18px; border-bottom:5px solid currentColor; }
    .claw-icon .left { left:3px; border-left:5px solid currentColor; border-radius:0 0 0 18px; transform:rotate(-12deg); }
    .claw-icon .right { right:3px; border-right:5px solid currentColor; border-radius:0 0 18px 0; transform:rotate(12deg); }
    #open .claw-icon .left { transform:translateX(-5px) rotate(-28deg); }
    #open .claw-icon .right { transform:translateX(5px) rotate(28deg); }
    #drop .claw-icon { transform:translateY(2px); }
    #drop .claw-icon::after { content:"↓"; position:absolute; right:-12px; top:5px; font-size:23px; font-weight:1000; }
    @keyframes neonPulse { 0%,100%{opacity:.72} 50%{opacity:1;filter:brightness(1.25)} }
    @media (prefers-reduced-motion:reduce) { header::after{animation:none} }
    @media (orientation:landscape) and (max-height:560px) { main{max-width:900px;grid-template-columns:180px 1fr;grid-template-rows:auto minmax(0,1fr);gap:10px}header{grid-row:1/3;min-height:0;padding:12px}.logo{width:160px;height:auto}.connection{top:auto;bottom:14px;right:50%;transform:translateX(50%)}.session{grid-column:2}.controls{grid-column:2;grid-template-columns:1fr .55fr}.dpad{height:100%;width:auto;margin:auto}.actions{grid-template-columns:1fr 1fr;grid-template-rows:1fr}.action{height:100%;width:auto}#open{aspect-ratio:1;border-radius:50%} }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="logo" src="Ecc Logo.png" alt="Egyptian Company for Cosmetics">
      <div id="connection" class="connection"><span class="dot"></span><span class="label">OFFLINE</span></div>
    </header>
    <section class="session">
      <button id="start" disabled>CONNECTING...</button>
      <div id="timer" class="timer" aria-live="polite">00:30</div>
    </section>
    <section id="controls" class="controls locked" aria-label="Claw controls">
      <div class="dpad">
        <button id="up" class="move" data-direction="up" aria-label="Move forward">▲</button>
        <button id="left" class="move" data-direction="left" aria-label="Move left">◀</button>
        <div class="center">MOVE<br>CLAW</div>
        <button id="right" class="move" data-direction="right" aria-label="Move right">▶</button>
        <button id="down" class="move" data-direction="down" aria-label="Move backward">▼</button>
      </div>
      <div class="actions">
        <button id="drop" class="action" aria-label="Drop claw">
          <span class="claw-icon" aria-hidden="true"><i class="hub"></i><i class="talon left"></i><i class="talon right"></i></span>
          <span class="action-label">DROP CLAW</span>
        </button>
        <button id="open" class="action" aria-label="Open claw">
          <span class="claw-icon" aria-hidden="true"><i class="hub"></i><i class="talon left"></i><i class="talon right"></i></span>
          <span class="action-label">OPEN CLAW</span>
        </button>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCMtbsKNIET9NjOyw2XHzA9PfyBn1yO1O4",
      authDomain: "fallingobjects-46163.firebaseapp.com",
      databaseURL: "https://fallingobjects-46163-default-rtdb.firebaseio.com",
      projectId: "fallingobjects-46163",
      storageBucket: "fallingobjects-46163.firebasestorage.app",
      messagingSenderId: "243170931177",
      appId: "1:243170931177:web:778f044433b5ee2956db78"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const control = db.ref("machines/red-blue-01/control");
    const connection = document.getElementById("connection");
    const controls = document.getElementById("controls");
    const startButton = document.getElementById("start");
    const timerDisplay = document.getElementById("timer");
    const heldPointers = new Map();
    const GAME_SECONDS = 30;
    const newClientId = () => crypto.randomUUID
      ? crypto.randomUUID()
      : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    // A new page is a new controller, even when a browser duplicates a tab.
    const clientId = newClientId();
    let gameActive = false;
    let gameEndsAt = 0;
    let serverTimeOffset = 0;
    let firebaseOnline = false;
    let sessionStateLoaded = false;

    const serverNow = () => Date.now() + serverTimeOffset;

    function update(values) {
      return control.update(values).catch(error => console.error("Firebase write failed:", error));
    }

    function setDirection(direction, pressed) {
      if (!gameActive) return;
      document.getElementById(direction).classList.toggle("active", pressed);
      update({ [direction]: pressed });
    }

    document.querySelectorAll(".move").forEach(button => {
      button.addEventListener("pointerdown", event => {
        if (!gameActive) return;
        if (event.button !== 0) return;
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        heldPointers.set(event.pointerId, button.dataset.direction);
        setDirection(button.dataset.direction, true);
      });
      const release = event => {
        const direction = heldPointers.get(event.pointerId);
        if (!direction) return;
        heldPointers.delete(event.pointerId);
        setDirection(direction, false);
      };
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
    });

    function increment(command) {
      if (!gameActive) return Promise.resolve();
      if (navigator.vibrate) navigator.vibrate(35);
      return control.child(command).transaction(value => (Number(value) || 0) + 1);
    }

    document.getElementById("drop").addEventListener("pointerdown", event => { event.preventDefault(); increment("dropCommand"); });
    document.getElementById("open").addEventListener("pointerdown", event => { event.preventDefault(); increment("openCommand"); });

    function renderTimer() {
      const seconds = Math.max(0, Math.ceil((gameEndsAt - serverNow()) / 1000));
      timerDisplay.textContent = `00:${String(seconds).padStart(2, "0")}`;
      if (seconds <= 0) showAvailable();
    }

    startButton.addEventListener("pointerdown", event => {
      if (startButton.disabled) return;
      event.preventDefault();
      if (navigator.vibrate) navigator.vibrate(45);
      startButton.disabled = true;
      startButton.textContent = "STARTING...";

      const now = serverNow();
      control.transaction(current => {
        current = current || {};
        if ((Number(current.gameEndsAt) || 0) > now) return;
        return {
          ...current,
          up:false, down:false, left:false, right:false,
          startCommand:(Number(current.startCommand) || 0) + 1,
          gameEndsAt:now + GAME_SECONDS * 1000,
          activeControllerId:clientId
        };
      })
        .then(result => {
          if (!result.committed) showBusy(result.snapshot.val() || {});
        })
        .catch(error => {
          console.error("Could not start game:", error);
          startButton.disabled = !(firebaseOnline && sessionStateLoaded);
          startButton.textContent = "START GAME";
        });
    });

    function releaseAll(writeRemote = gameActive) {
      heldPointers.clear();
      document.querySelectorAll(".move").forEach(button => button.classList.remove("active"));
      if (writeRemote) update({ up:false, down:false, left:false, right:false });
    }

    function showAvailable() {
      const wasActive = gameActive;
      gameActive = false;
      if (wasActive) releaseAll(true);
      controls.classList.add("locked");
      timerDisplay.classList.remove("running");
      timerDisplay.textContent = "00:30";
      startButton.disabled = !(firebaseOnline && sessionStateLoaded);
      startButton.textContent = firebaseOnline && sessionStateLoaded ? "START GAME" : "CONNECTING...";
    }

    function showBusy(state) {
      const wasActive = gameActive;
      gameEndsAt = Number(state.gameEndsAt) || 0;
      gameActive = gameEndsAt > serverNow() && state.activeControllerId === clientId;
      if (wasActive && !gameActive) releaseAll(true);
      controls.classList.toggle("locked", !gameActive);
      timerDisplay.classList.toggle("running", gameEndsAt > serverNow());
      startButton.disabled = gameEndsAt > serverNow();
      startButton.textContent = gameActive ? "YOUR GAME" : "PLEASE WAIT";
      renderTimer();
    }

    db.ref(".info/serverTimeOffset").on("value", snapshot => {
      serverTimeOffset = Number(snapshot.val()) || 0;
    });

    control.on("value", snapshot => {
      sessionStateLoaded = true;
      const state = snapshot.val() || {};
      if ((Number(state.gameEndsAt) || 0) > serverNow()) showBusy(state);
      else showAvailable();
    });

    setInterval(() => {
      if (gameEndsAt > serverNow()) renderTimer();
    }, 200);

    db.ref(".info/connected").on("value", snapshot => {
      const online = snapshot.val() === true;
      firebaseOnline = online;
      connection.classList.toggle("connected", online);
      connection.querySelector(".label").textContent = online ? "ONLINE" : "OFFLINE";
      if (online) {
        releaseAll(false);
        if (sessionStateLoaded && gameEndsAt <= serverNow()) showAvailable();
      } else {
        controls.classList.add("locked");
        startButton.disabled = true;
        startButton.textContent = "CONNECTING...";
      }
    });

    window.addEventListener("blur", () => releaseAll());
    window.addEventListener("pagehide", () => releaseAll());
    document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });
    document.addEventListener("contextmenu", event => event.preventDefault());
    document.addEventListener("touchmove", event => event.preventDefault(), { passive:false });
  </script>
</body>
</html>
