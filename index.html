<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#090b18">
  <title>Claw Machine Controller</title>
  <style>
    :root { --cyan:#50edf2; --cyan-deep:#00aeb8; --ice:#eefeff; --graphite:#28343b; --silver:#cad6d9; --panel:rgba(242,252,253,.92); --line:rgba(68,111,118,.22); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; touch-action:none; }
    body { color:var(--graphite); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(circle at 50% -15%,#29464d 0 8%,transparent 44%),radial-gradient(circle at 18% 82%,#0c3940 0,transparent 30%),linear-gradient(145deg,#080d0f,#172125 48%,#05090b); padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.25; background:repeating-linear-gradient(90deg,transparent 0 44px,#5ffaff0c 45px 46px),repeating-linear-gradient(0deg,transparent 0 44px,#5ffaff08 45px 46px); }
    main { position:relative; z-index:1; width:min(100%,560px); height:100%; margin:auto; display:grid; grid-template-rows:auto auto minmax(0,1fr); gap:clamp(8px,1.5vh,14px); }
    header { position:relative; min-height:128px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:6px 42px; overflow:hidden; border:2px solid #9cffff; border-radius:28px; background:linear-gradient(145deg,#fff 0 38%,#e3edef 72%,#c8d6d9); box-shadow:0 0 10px #50edf2,0 0 28px #19e8ef77,0 18px 38px #000b,inset 0 2px #fff,inset 0 -4px #93a9ad38; }
    header::after { content:""; position:absolute; inset:auto 7% 0; height:4px; border-radius:99px; background:#baffff; box-shadow:0 0 8px #fff,0 0 20px var(--cyan),0 0 38px var(--cyan); animation:neonPulse 2.4s ease-in-out infinite; }
    .logo { display:block; width:min(84vw,390px); height:108px; object-fit:contain; transform:scale(1.08); filter:drop-shadow(0 0 9px #50edf2aa) drop-shadow(0 6px 8px #26607938); }
    .connection { position:absolute; top:12px; right:13px; display:flex; align-items:center; gap:6px; color:#708187; font-size:.62rem; font-weight:900; }
    .dot { width:11px; height:11px; border-radius:50%; background:#89979b; box-shadow:0 0 10px #73888e; }
    .connected .dot { background:var(--cyan); box-shadow:0 0 14px var(--cyan-deep); }
    .connected .label { color:#008b94; }
    .session { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; }
    #start { min-height:54px; border:2px solid #caffff; border-radius:22px; background:linear-gradient(145deg,#efffff,#53f1f5 55%,#00a8b3); color:#12383b; font-size:clamp(1rem,5vw,1.35rem); letter-spacing:.08em; text-shadow:0 1px #fff8; box-shadow:0 0 10px #50edf2,0 0 24px #50edf288,inset 0 2px #fff; }
    #start:disabled { filter:grayscale(.7); opacity:.55; }
    .timer { min-width:82px; height:54px; display:grid; place-items:center; border:2px solid #60e9ee; border-radius:22px; background:#0b171acc; font-size:1.45rem; font-weight:900; font-variant-numeric:tabular-nums; color:#77c9cd; text-shadow:0 0 9px currentColor; box-shadow:0 0 16px #50edf255,inset 0 0 16px #50edf21f; }
    .timer.running { color:#007f87; box-shadow:inset 0 0 20px #50edf266,0 0 16px #50edf255; }
    .controls { position:relative; min-height:0; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(110px,.85fr); gap:clamp(12px,3vw,20px); padding:clamp(10px,2.5vw,16px); border:2px solid #8ffcff; border-radius:30px; background:linear-gradient(145deg,#fafffff2,#cbdadde8); box-shadow:0 0 9px #8ffcff,0 0 28px #50edf266,0 20px 38px #000a,inset 0 2px #fff,inset 0 -3px #849b9f33; }
    .controls::before { content:"ECC CONTROL DECK"; position:absolute; left:50%; top:5px; transform:translateX(-50%); white-space:nowrap; color:#698086; font-size:.46rem; font-weight:900; letter-spacing:.22em; }
    .controls.locked { opacity:.32; filter:grayscale(.7); pointer-events:none; }
    .dpad { min-height:0; display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); gap:8px; aspect-ratio:1; align-self:center; }
    button { position:relative; overflow:hidden; border:2px solid #a8fcff; color:#195257; font:inherit; font-weight:900; cursor:pointer; touch-action:none; background:linear-gradient(145deg,#fff,#dce7e9 68%,#b9c9cc); box-shadow:0 0 8px #50edf288,0 9px 18px #0006,inset 0 2px #fff,inset 0 -4px #8fa4a844; transition:transform 65ms,filter 65ms,box-shadow 100ms; }
    button.active,button:active { transform:translateY(4px) scale(.97); filter:brightness(.8); box-shadow:0 3px 8px #0008,inset 0 2px 5px #0007; }
    .move { border-radius:24px; font-size:clamp(1.55rem,8vw,2.5rem); color:#00a5af; text-shadow:0 0 7px #fff,0 0 15px #50edf2; }
    #up { grid-area:1/2; } #left { grid-area:2/1; } #right { grid-area:2/3; } #down { grid-area:3/2; }
    .center { grid-area:2/2; display:grid; place-items:center; border-radius:50%; background:radial-gradient(circle,#faffff,#b9cbce); border:2px solid #7ceff3; color:#587076; font-size:.7rem; font-weight:900; text-align:center; box-shadow:0 0 18px #50edf288; }
    .actions { min-height:0; display:grid; grid-template-rows:1fr .48fr; gap:12px; }
    .action { border-radius:50%; align-self:center; aspect-ratio:1; display:grid; place-items:center; align-content:center; gap:5px; color:#164b50; }
    #drop { background:radial-gradient(circle at 38% 28%,#fff 0 10%,#adfbfd 35%,#42e1e7 62%,#00a1ac 100%); border:5px solid #dfffff; box-shadow:0 9px 20px #24797d66,0 0 22px #50edf2aa,inset 0 2px #fff; }
    #open { aspect-ratio:auto; min-height:72px; border-radius:24px; background:linear-gradient(145deg,#fff,#d5f8f9 62%,#91dfe3); }
    .action-label { font-size:clamp(.58rem,2.8vw,.76rem); letter-spacing:.14em; }
    .claw-icon { position:relative; width:54px; height:46px; display:block; }
    .claw-icon::before { content:""; position:absolute; left:24px; top:0; width:6px; height:18px; border-radius:8px; background:currentColor; box-shadow:0 0 8px #fff; }
    .claw-icon .hub { position:absolute; left:17px; top:14px; width:20px; height:14px; border:5px solid currentColor; border-radius:5px 5px 11px 11px; }
    .claw-icon .talon { position:absolute; top:25px; width:22px; height:18px; border-bottom:5px solid currentColor; }
    .claw-icon .left { left:3px; border-left:5px solid currentColor; border-radius:0 0 0 18px; transform:rotate(-12deg); }
    .claw-icon .right { right:3px; border-right:5px solid currentColor; border-radius:0 0 18px 0; transform:rotate(12deg); }
    #open .claw-icon .left { transform:translateX(-5px) rotate(-28deg); }
    #open .claw-icon .right { transform:translateX(5px) rotate(28deg); }
    #drop .claw-icon { transform:translateY(2px); }
    #drop .claw-icon::after { content:"↓"; position:absolute; right:-12px; top:5px; font-size:23px; font-weight:1000; }
    @keyframes neonPulse { 0%,100%{opacity:.72} 50%{opacity:1;filter:brightness(1.25)} }
    .energy-line { position:fixed; z-index:0; width:42vw; height:1px; opacity:.5; pointer-events:none; background:linear-gradient(90deg,transparent,#50edf2,transparent); box-shadow:0 0 12px #50edf2; animation:energyDrift 4.8s linear infinite; }
    .energy-line.one { top:24%; left:-42vw; }
    .energy-line.two { bottom:18%; right:-42vw; animation-direction:reverse; animation-delay:-2.1s; }
    header .logo { animation:brandBreath 3.2s ease-in-out infinite; }
    #start:not(:disabled) { animation:startReady 1.65s ease-in-out infinite; }
    .controls:not(.locked) { animation:deckLive 2s ease-in-out infinite; }
    .controls:not(.locked) .center { animation:centerCore 1.8s ease-in-out infinite; }
    .controls:not(.locked) .move { animation:arrowIdle 2.4s ease-in-out infinite; }
    .controls:not(.locked) .move:nth-child(2n) { animation-delay:-1.2s; }
    .move.active { animation:none!important; color:#eaffff; background:linear-gradient(145deg,#66f8fc,#00aab4); box-shadow:0 0 12px #fff,0 0 28px #50edf2,inset 0 0 18px #007a82; }
    #drop:active .claw-icon { animation:clawDrop .38s ease-in-out; }
    #open:active .claw-icon .left { transform:translateX(-10px) rotate(-38deg); }
    #open:active .claw-icon .right { transform:translateX(10px) rotate(38deg); }
    .claw-icon .talon { transition:transform .2s ease; }
    .timer.urgent { color:#fff; border-color:#ff4967; background:#4a0713; text-shadow:0 0 9px #fff,0 0 18px #ff3150; box-shadow:0 0 10px #ff3150,0 0 26px #ff315088; animation:urgentBeat .55s ease-in-out infinite; }
    .tap-ripple { position:absolute; z-index:5; width:18px; height:18px; margin:-9px 0 0 -9px; pointer-events:none; border:2px solid #fff; border-radius:50%; box-shadow:0 0 10px #50edf2; animation:rippleOut .55s ease-out forwards; }
    @keyframes energyDrift { to{transform:translateX(142vw)} }
    @keyframes brandBreath { 0%,100%{filter:drop-shadow(0 0 7px #50edf288) drop-shadow(0 5px 7px #26607932)} 50%{filter:drop-shadow(0 0 14px #50edf2) drop-shadow(0 7px 10px #26607955)} }
    @keyframes startReady { 0%,100%{box-shadow:0 0 10px #50edf2,0 0 20px #50edf266,inset 0 2px #fff} 50%{box-shadow:0 0 15px #fff,0 0 36px #50edf2,inset 0 2px #fff} }
    @keyframes deckLive { 0%,100%{box-shadow:0 0 9px #8ffcff,0 0 24px #50edf25c,0 20px 38px #000a,inset 0 2px #fff} 50%{box-shadow:0 0 13px #dfffff,0 0 38px #50edf299,0 20px 38px #000a,inset 0 2px #fff} }
    @keyframes centerCore { 50%{transform:scale(1.045);box-shadow:0 0 28px #50edf2} }
    @keyframes arrowIdle { 50%{text-shadow:0 0 8px #fff,0 0 24px #50edf2} }
    @keyframes clawDrop { 45%{transform:translateY(11px)} }
    @keyframes urgentBeat { 50%{transform:scale(1.055)} }
    @keyframes rippleOut { to{width:130px;height:130px;margin:-65px 0 0 -65px;opacity:0} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important} }
    @media (orientation:landscape) and (max-height:560px) { main{max-width:900px;grid-template-columns:220px 1fr;grid-template-rows:auto minmax(0,1fr);gap:10px}header{grid-row:1/3;min-height:0;padding:10px}.logo{width:210px;height:auto;transform:scale(1.05)}.connection{top:auto;bottom:14px;right:50%;transform:translateX(50%)}.session{grid-column:2}.controls{grid-column:2;grid-template-columns:1fr .55fr}.dpad{height:100%;width:auto;margin:auto}.actions{grid-template-columns:1fr 1fr;grid-template-rows:1fr}.action{height:100%;width:auto}#open{aspect-ratio:1;border-radius:50%} }

    /* Casual ECC game theme */
    body { background:radial-gradient(circle at 12% 8%,#fff 0 9%,transparent 28%),radial-gradient(circle at 88% 88%,#7beff3 0 5%,transparent 25%),linear-gradient(145deg,#d8f8fa,#eefeff 48%,#bcecef); }
    body::before { opacity:.3; background:radial-gradient(circle at 18% 30%,#50edf2 0 7px,transparent 8px),radial-gradient(circle at 80% 18%,#fff 0 11px,transparent 12px),radial-gradient(circle at 72% 72%,#00aeb8 0 5px,transparent 6px); background-size:130px 150px,170px 190px,110px 140px; animation:bubbleFloat 12s linear infinite; }
    .energy-line { width:56px; height:56px; border:2px solid #50edf288; border-radius:50%; background:#ffffff55; box-shadow:0 8px 22px #00aeb833; animation:casualFloat 7s ease-in-out infinite; }
    .energy-line.one { left:5%; top:18%; }

    header { border:0; border-radius:34px; background:#fffffff0; box-shadow:0 12px 28px #187a8030,inset 0 2px #fff; }
    header::after { inset:auto 20% 7px; height:5px; border-radius:99px; box-shadow:0 3px 10px #50edf277; animation:none; }
    header .logo { animation:casualLogo 4s ease-in-out infinite; }
    .connection { padding:5px 8px; border-radius:99px; background:#e1f9fa; }
    .session { gap:12px; }
    #start { border:0; border-radius:28px; color:#fff; background:linear-gradient(145deg,#24d6dd,#009ca6); text-shadow:0 1px #00676d; box-shadow:0 9px 18px #008f9744,inset 0 2px #ffffff88; }
    #start:not(:disabled) { animation:casualStart 2s ease-in-out infinite; }
    .timer { border:0; border-radius:25px; color:#087c83; background:#fffffff2; text-shadow:none; box-shadow:0 9px 18px #187a8026; }
    .timer.running { color:#087c83; background:#fff; box-shadow:0 9px 18px #187a8026,inset 0 -4px #50edf244; }
    .controls { border:0; border-radius:38px; background:#ffffffdd; box-shadow:0 18px 38px #187a8033,inset 0 2px #fff; }

    button.active,button:active { filter:none; box-shadow:0 3px 8px #187a8044,inset 0 3px 7px #008d9544; }

    .controls:not(.locked) .center { animation:casualCenter 2.2s ease-in-out infinite; }
    #drop { border:0; background:linear-gradient(145deg,#5cf0f4,#00aeb8); box-shadow:0 10px 20px #008f9760,inset 0 2px #ffffffaa; }
    #open { border-radius:27px; background:linear-gradient(145deg,#fff,#c9f5f7); }
    @keyframes bubbleFloat { to{background-position:130px -150px,-170px 190px,110px -140px} }
    @keyframes casualFloat { 50%{transform:translateY(-18px) rotate(8deg)} }
    @keyframes casualLogo { 50%{transform:scale(1.1) translateY(-2px);filter:drop-shadow(0 8px 12px #168a9040)} }
    @keyframes casualStart { 50%{transform:translateY(-2px);box-shadow:0 12px 24px #008f9766,inset 0 2px #ffffffaa} }
    @keyframes casualDeck { 50%{transform:translateY(-2px);box-shadow:0 22px 42px #187a8044,inset 0 2px #fff} }
    @keyframes casualArrow { 50%{transform:translateY(-2px);color:#00cbd4} }
    @keyframes casualCenter { 50%{transform:scale(1.04) rotate(2deg)} }
    /* Arcade cabinet theme */
    :root { --arcade-red:#ff244f; --arcade-blue:#18d9ff; --arcade-yellow:#ffd43b; --arcade-purple:#842dff; --ink:#080511; --deck:#171022; }
    body { color:#fff; font-family:"Arial Black","Segoe UI Black",Impact,system-ui,sans-serif; background:radial-gradient(circle at 50% -8%,#481356 0,transparent 35%),radial-gradient(circle at 12% 82%,#08295f 0,transparent 38%),linear-gradient(160deg,#06030c,#11071a 58%,#030106); }
    body::before { opacity:.58; background:linear-gradient(#ffffff06 50%,#00000016 50%),radial-gradient(circle at 10% 12%,#ffd43b 0 2px,transparent 3px),radial-gradient(circle at 88% 28%,#18d9ff 0 2px,transparent 3px),radial-gradient(circle at 28% 82%,#ff244f 0 2px,transparent 3px); background-size:100% 4px,83px 79px,101px 97px,121px 113px; animation:starScroll 18s linear infinite; }

    .connection { top:11px; right:19px; padding:4px 7px; color:#8d809b; background:#08040ecc; border:1px solid #49305e; border-radius:4px; font-family:ui-monospace,Consolas,monospace; }

    #start { min-height:58px; border:3px solid #ff8fab; border-radius:11px; color:#fff; background:linear-gradient(#ff3d68,#c50938); text-shadow:2px 2px #6c001d; box-shadow:0 6px 0 #71001e,0 0 18px #ff244f99,inset 0 2px #ffabc0; animation:insertCoin 1.1s steps(2) infinite!important; }

<body>
  <span class="energy-line one" aria-hidden="true"></span>
  <span class="energy-line two" aria-hidden="true"></span>
  <main>
    <header>
      <img class="logo" src="Nutrition Hub Logo v2.png" alt="ECC Nutrition Hub">
      <div id="connection" class="connection"><span class="dot"></span><span class="label">OFFLINE</span></div>
    </header>
    <section class="session">
      <button id="start" disabled>CONNECTING...</button>
      <div id="timer" class="timer" aria-live="polite">00:45</div>
    </section>
    <section id="controls" class="controls locked" aria-label="Claw controls">
      <div class="dpad">
        <button id="up" class="move" data-direction="up" aria-label="Move forward">▲</button>
        <button id="left" class="move" data-direction="left" aria-label="Move left">◀</button>
        <div class="center">MOVE<br>CLAW</div>
        <button id="right" class="move" data-direction="right" aria-label="Move right">▶</button>
        <button id="down" class="move" data-direction="down" aria-label="Move backward">▼</button>
      </div>
      <div class="actions">
        <button id="drop" class="action" aria-label="Drop claw">
          <span class="claw-icon" aria-hidden="true"><i class="hub"></i><i class="talon left"></i><i class="talon right"></i></span>
          <span class="action-label">DROP CLAW</span>
        </button>
        <button id="open" class="action" aria-label="Open claw">
          <span class="claw-icon" aria-hidden="true"><i class="hub"></i><i class="talon left"></i><i class="talon right"></i></span>
          <span class="action-label">OPEN CLAW</span>
        </button>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCMtbsKNIET9NjOyw2XHzA9PfyBn1yO1O4",
      authDomain: "fallingobjects-46163.firebaseapp.com",
      databaseURL: "https://fallingobjects-46163-default-rtdb.firebaseio.com",
      projectId: "fallingobjects-46163",
      storageBucket: "fallingobjects-46163.firebasestorage.app",
      messagingSenderId: "243170931177",
      appId: "1:243170931177:web:778f044433b5ee2956db78"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const control = db.ref("machines/red-blue-01/control");
    const connection = document.getElementById("connection");
    const controls = document.getElementById("controls");
    const startButton = document.getElementById("start");
    const timerDisplay = document.getElementById("timer");
    const heldPointers = new Map();
    const GAME_SECONDS = 45;
    const RESULT_SECONDS = 10;
    const DEMO_MODE = new URLSearchParams(window.location.search).has("demo");
    const newClientId = () => crypto.randomUUID
      ? crypto.randomUUID()
      : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    // A new page is a new controller, even when a browser duplicates a tab.
    const clientId = newClientId();
    let gameActive = false;
    let gameEndsAt = 0;
    let playEndsAt = 0;
    let serverTimeOffset = 0;
    let firebaseOnline = false;
    let sessionStateLoaded = false;

    const serverNow = () => Date.now() + serverTimeOffset;

    function update(values) {
      if (DEMO_MODE) return Promise.resolve();
      return control.update(values).catch(error => console.error("Firebase write failed:", error));
    }

    function setDirection(direction, pressed) {
      if (!gameActive) return;
      document.getElementById(direction).classList.toggle("active", pressed);
      update({ [direction]: pressed });
    }

    document.querySelectorAll(".move").forEach(button => {
      button.addEventListener("pointerdown", event => {
        if (!gameActive) return;
        if (event.button !== 0) return;
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        heldPointers.set(event.pointerId, button.dataset.direction);
        setDirection(button.dataset.direction, true);
      });
      const release = event => {
        const direction = heldPointers.get(event.pointerId);
        if (!direction) return;
        heldPointers.delete(event.pointerId);
        setDirection(direction, false);
      };
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
    });

    function increment(command) {
      if (!gameActive) return Promise.resolve();
      if (navigator.vibrate) navigator.vibrate(35);
      if (DEMO_MODE) return Promise.resolve();
      return control.child(command).transaction(value => (Number(value) || 0) + 1);
    }

    document.getElementById("drop").addEventListener("pointerdown", event => { event.preventDefault(); increment("dropCommand"); });
    document.getElementById("open").addEventListener("pointerdown", event => { event.preventDefault(); increment("openCommand"); });

    function beginDemoGame() {
      releaseAll(false);
      gameActive = true;
      playEndsAt = Date.now() + GAME_SECONDS * 1000;
      gameEndsAt = playEndsAt + RESULT_SECONDS * 1000;
      document.body.classList.add("playing");
      controls.classList.remove("locked");
      timerDisplay.classList.add("running");
      startButton.disabled = true;
      startButton.textContent = "DEMO PLAYING";
      renderTimer();
    }

    function renderTimer() {
      const now = serverNow();
      const playing = playEndsAt > now;
      const deadline = playing ? playEndsAt : gameEndsAt;
      const seconds = Math.max(0, Math.ceil((deadline - now) / 1000));
      timerDisplay.textContent = `00:${String(seconds).padStart(2, "0")}`;
      timerDisplay.classList.toggle("urgent", playing && gameActive && seconds > 0 && seconds <= 5);

      if (!playing && gameActive) {
        gameActive = false;
        releaseAll(true);
        controls.classList.add("locked");
        document.body.classList.remove("playing");
        startButton.textContent = "RESULT";
      }

      if (gameEndsAt <= now) showAvailable();
    }

    startButton.addEventListener("pointerdown", event => {
      if (startButton.disabled) return;
      event.preventDefault();
      if (navigator.vibrate) navigator.vibrate(45);

      if (DEMO_MODE) {
        beginDemoGame();
        return;
      }

      startButton.disabled = true;
      startButton.textContent = "STARTING...";

      const now = serverNow();
      control.transaction(current => {
        current = current || {};
        if ((Number(current.gameEndsAt) || 0) > now) return;
        return {
          ...current,
          up:false, down:false, left:false, right:false,
          startCommand:(Number(current.startCommand) || 0) + 1,
          playEndsAt:now + GAME_SECONDS * 1000,
          gameEndsAt:now + (GAME_SECONDS + RESULT_SECONDS) * 1000,
          activeControllerId:clientId
        };
      })
        .then(result => {
          if (!result.committed) showBusy(result.snapshot.val() || {});
        })
        .catch(error => {
          console.error("Could not start game:", error);
          startButton.disabled = !(firebaseOnline && sessionStateLoaded);
          startButton.textContent = "START GAME";
        });
    });

    function releaseAll(writeRemote = gameActive) {
      heldPointers.clear();
      document.querySelectorAll(".move").forEach(button => button.classList.remove("active"));
      if (writeRemote) update({ up:false, down:false, left:false, right:false });
    }

    function showAvailable() {
      const wasActive = gameActive;
      gameActive = false;
      gameEndsAt = 0;
      playEndsAt = 0;
      document.body.classList.remove("playing");
      timerDisplay.classList.remove("urgent");
      if (wasActive) releaseAll(true);
      controls.classList.add("locked");
      timerDisplay.classList.remove("running");
      timerDisplay.textContent = "00:45";
      if (DEMO_MODE) {
        startButton.disabled = false;
        startButton.textContent = "START DEMO";
        return;
      }
      startButton.disabled = !(firebaseOnline && sessionStateLoaded);
      startButton.textContent = firebaseOnline && sessionStateLoaded ? "START GAME" : "CONNECTING...";
    }

    function showBusy(state) {
      const wasActive = gameActive;
      gameEndsAt = Number(state.gameEndsAt) || 0;
      playEndsAt = Number(state.playEndsAt) || 0;
      const sessionActive = gameEndsAt > serverNow();
      const playActive = playEndsAt > serverNow();
      gameActive = sessionActive && playActive && state.activeControllerId === clientId;
      document.body.classList.toggle("playing", gameActive);
      if (wasActive && !gameActive) releaseAll(true);
      controls.classList.toggle("locked", !gameActive);
      timerDisplay.classList.toggle("running", sessionActive);
      startButton.disabled = sessionActive;
      startButton.textContent = gameActive ? "YOUR GAME" : (playActive ? "PLEASE WAIT" : "RESULT");
      renderTimer();
    }

    db.ref(".info/serverTimeOffset").on("value", snapshot => {
      if (DEMO_MODE) return;
      serverTimeOffset = Number(snapshot.val()) || 0;
    });

    control.on("value", snapshot => {
      if (DEMO_MODE) return;
      sessionStateLoaded = true;
      const state = snapshot.val() || {};
      if ((Number(state.gameEndsAt) || 0) > serverNow()) showBusy(state);
      else showAvailable();
    });

    setInterval(() => {
      // Keep checking through zero; otherwise the display can remain at 00:01
      // until another Firebase event or button press wakes the UI.
      if (gameEndsAt > 0) renderTimer();
    }, 200);

    db.ref(".info/connected").on("value", snapshot => {
      if (DEMO_MODE) return;
      const online = snapshot.val() === true;
      firebaseOnline = online;
      connection.classList.toggle("connected", online);
      connection.querySelector(".label").textContent = online ? "ONLINE" : "OFFLINE";
      if (online) {
        releaseAll(false);
        if (sessionStateLoaded && gameEndsAt <= serverNow()) showAvailable();
      } else {
        controls.classList.add("locked");
        startButton.disabled = true;
        startButton.textContent = "CONNECTING...";
      }
    });

    window.addEventListener("blur", () => releaseAll());
    window.addEventListener("pagehide", () => releaseAll());
    document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });
    document.addEventListener("contextmenu", event => event.preventDefault());
    document.addEventListener("touchmove", event => event.preventDefault(), { passive:false });

    document.querySelectorAll("button").forEach(button => {
      button.addEventListener("pointerdown", event => {
        if (button.disabled) return;
        const rect = button.getBoundingClientRect();
        const ripple = document.createElement("span");
        ripple.className = "tap-ripple";
        ripple.style.left = `${event.clientX - rect.left}px`;
        ripple.style.top = `${event.clientY - rect.top}px`;
        button.appendChild(ripple);
        ripple.addEventListener("animationend", () => ripple.remove(), { once:true });
      });
    });

    if (DEMO_MODE) {
      firebaseOnline = true;
      sessionStateLoaded = true;
      connection.classList.add("connected");
      connection.querySelector(".label").textContent = "DEMO";
      showAvailable();
    }
  </script>
</body>
</html>
